<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha carteira | Agência de Investimentos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/estilo.css">
</head>
<body>

  <header class="topo">
    <p class="marca">Agência de Investimentos</p>
    <a href="index.html" id="sair">Sair</a>
  </header>

  <main class="conteudo">
    <h1 id="titulo">Olá</h1>
    <p class="subtitulo" id="subtitulo">Estes são os seus dados e os investimentos que você tem.</p>

    <div class="painel-duplo">

      <section class="bloco">
        <h2>Dados pessoais</h2>
        <dl class="lista-dados">
          <div><dt>Nome</dt><dd id="dado-nome"></dd></div>
          <div><dt>CPF</dt><dd id="dado-cpf"></dd></div>
          <div><dt>Nascimento</dt><dd id="dado-nascimento"></dd></div>
          <div><dt>Gênero</dt><dd id="dado-genero"></dd></div>
        </dl>
      </section>

      <section class="bloco">
        <h2>Contatos</h2>
        <dl class="lista-dados" id="lista-contatos"></dl>
      </section>

    </div>

    <section class="bloco">
      <h2>Minha carteira</h2>

      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr>
              <th scope="col">Investimento</th>
              <th scope="col">Tipo</th>
              <th scope="col">Fornecedor</th>
              <th scope="col" class="num">Rendimento</th>
              <th scope="col" class="num">Aplicação</th>
              <th scope="col">Início</th>
              <th scope="col">Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-carteira"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script/usuario.js"></script>
</body>
</html>
