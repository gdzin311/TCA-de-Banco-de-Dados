<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | Agência de Investimentos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/estilo.css">
</head>
<body>
  <main class="acesso">

    <section class="acesso-destaque">
      <p class="marca">Agência de Investimentos</p>
      <h1>Seus investimentos, num só lugar.</h1>
      <p>Renda fixa, ações e fundos imobiliários, com o que você aplicou e quando.</p>
    </section>

    <section class="acesso-form">
      <h2>Entrar na sua conta</h2>

      <form id="form-login">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" inputmode="numeric"
               maxlength="14" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha"
               autocomplete="current-password" required>

        <p class="erro" id="erro" role="alert" hidden></p>

        <button type="submit">Entrar</button>
      </form>

      <p class="troca">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </section>

  </main>

  <script src="script/login.js"></script>
</body>
</html>
