<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Agência de Investimentos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/base.css">
  <link rel="stylesheet" href="style/formulario.css">
  <link rel="stylesheet" href="style/acesso.css">
</head>
<body>
  <main class="acesso">

    <section class="acesso-destaque">
      <p class="marca">Agência de Investimentos</p>
      <h1>Crie sua conta em um minuto.</h1>
      <p>Com ela você acompanha o que aplicou, em quais fornecedores e desde quando.</p>
    </section>

    <section class="acesso-form">
      <h2>Criar conta</h2>

      <form id="form-cadastro">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" maxlength="200"
               autocomplete="name" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" inputmode="numeric"
               maxlength="14" autocomplete="off" required>

        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento"
               autocomplete="bday" required>

        <label for="genero">Gênero</label>
        <select id="genero" name="genero" required>
          <option value="" disabled selected>Selecione</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
          <option value="Outro">Outro</option>
          <option value="Prefiro não informar">Prefiro não informar</option>
        </select>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" maxlength="200"
               autocomplete="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="6"
               autocomplete="new-password" required>
        <p class="dica">Mínimo de 6 caracteres.</p>

        <label for="confirmar-senha">Confirmar senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha"
               autocomplete="new-password" required>

        <p class="erro" id="erro" role="alert" hidden></p>
        <p class="sucesso" id="sucesso" role="status" hidden></p>

        <button type="submit">Criar conta</button>
      </form>

      <p class="troca">Já tem conta? <a href="index.html">Entrar</a></p>
    </section>

  </main>
  <script src="script/cadastro.js"></script>
</body>
</html>
